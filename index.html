<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HBD Bebek</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #09090b;
            --card-bg: #121215;
            --border: #27272a;
            --text-main: #f4f4f5;
            --text-muted: #a1a1aa;
            --accent: #ef4444;
            --accent-hover: #dc2626;
        }

        body {
            background-color: var(--bg);
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 16px;
            width: 100%;
            max-width: 420px;
            padding: 28px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
            text-align: center;
        }

        .badge {
            display: inline-block;
            font-size: 12px;
            font-weight: 500;
            color: var(--accent);
            background: rgba(239, 68, 68, 0.1);
            padding: 4px 10px;
            border-radius: 20px;
            border: 1px solid rgba(239, 68, 68, 0.2);
            margin-bottom: 14px;
        }

        h1 {
            font-size: 20px;
            font-weight: 700;
            margin: 0 0 8px 0;
            letter-spacing: -0.025em;
        }

        p {
            color: var(--text-muted);
            font-size: 13px;
            line-height: 1.5;
            margin: 0 0 20px 0;
        }

        .video-container {
            width: 100%;
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid var(--border);
            margin-bottom: 20px;
            background: #000;
        }

        video {
            width: 100%;
            height: auto;
            display: block;
        }

        .gift-btn {
            background: var(--accent);
            color: white;
            font-weight: 600;
            font-size: 14px;
            padding: 12px 20px;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            width: 100%;
            transition: all 0.2s ease;
            box-shadow: 0 4px 12px rgba(239, 68, 68, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .gift-btn:hover {
            background: var(--accent-hover);
            transform: translateY(-1px);
            box-shadow: 0 6px 16px rgba(239, 68, 68, 0.4);
        }

        /* Modal Popup Styling */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(5px);
            justify-content: center;
            align-items: center;
            z-index: 1000;
            padding: 20px;
        }

        .modal-content {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 16px;
            max-width: 380px;
            width: 100%;
            padding: 20px;
            text-align: center;
            position: relative;
            animation: popUp 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        @keyframes popUp {
            0% { transform: scale(0.8); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        .modal-content img {
            width: 100%;
            border-radius: 10px;
            margin-bottom: 16px;
            border: 1px solid var(--border);
        }

        .close-btn {
            background: var(--border);
            color: var(--text-main);
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            transition: background 0.2s;
        }

        .close-btn:hover {
            background: #3f3f46;
        }
    </style>
</head>
<body>

    <div class="card">
        
        <h1>happy birthday</h1>
        <p>Bebekk!.</p>
        
        <div class="video-container">
            <video autoplay muted loop playsinline controls>
                <source src="video.mp4" type="video/mp4">
                Browser kamu tidak Mendukung Video.
            </video>
        </div>

        <button class="gift-btn" onclick="openModal()">
            <span>🎁</span> Buka Hadiah
        </button>
    </div>

    <div class="modal" id="giftModal">
        <div class="modal-content">
            <h3 style="margin-top: 0; margin-bottom: 12px; font-size: 18px;">SURPRISE! 🎁</h3>
            <img src="meme.jpeg" alt="Meme Red Box Surprise">
            <p style="font-size: 13px; margin-bottom: 16px;">Senengan mu bek!!</p>
            <button class="close-btn" onclick="closeModal()">Tutup</button>
        </div>
    </div>

    <script>
        const modal = document.getElementById('giftModal');

        function openModal() {
            modal.style.display = 'flex';
        }

        function closeModal() {
            modal.style.display = 'none';
        }

        window.onclick = function(event) {
            if (event.target === modal) {
                closeModal();
            }
        }
    </script>
</body>
</html>
